name: Check

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check bandit flake8
      - name: Bandit security scan
        run: python -m bandit -r gcham_datapack_builder -q
      - name: Flake8 critical error scan
        run: python -m flake8 gcham_datapack_builder scripts tests --select=E9,F63,F7,F82
      - name: Parse Python sources without generating bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in (*Path('gcham_datapack_builder').rglob('*.py'),
                       *Path('scripts').rglob('*.py'),
                       *Path('tests').rglob('*.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python AST parse passed')
          PY
      - name: Run core and workflow contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Build and validate plugin ZIP
        run: |
          python scripts/package_plugin.py --output dist/GCHAM_Data_Pack_Builder_1.1.5.zip
          python scripts/validate_package.py dist/GCHAM_Data_Pack_Builder_1.1.5.zip
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GCHAM_Data_Pack_Builder_1.1.5
          path: dist/GCHAM_Data_Pack_Builder_1.1.5.zip
          if-no-files-found: error
