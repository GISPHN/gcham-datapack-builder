name: Check

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply test patch scanner cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('gcham_datapack_builder/v112_patches.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    except Exception:\n        pass\n    engine = None\n',
              '    except Exception:\n        geometry = QgsGeometry(pref_geometry)\n    engine = None\n',
              1,
          )
          text = text.replace(
              '        except Exception:\n            pass\n    return bool(feature_geometry.intersects(pref_geometry))\n',
              '        except Exception:\n            return bool(feature_geometry.intersects(pref_geometry))\n    return bool(feature_geometry.intersects(pref_geometry))\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check bandit flake8
      - name: Bandit security scan
        run: bandit -r gcham_datapack_builder -q
      - name: Undefined-name scan
        run: flake8 gcham_datapack_builder --select=F821
      - name: Parse Python sources without generating bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('gcham_datapack_builder').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('Python AST parse passed')
          PY
      - name: Run core tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Build and validate plugin ZIP
        run: |
          python scripts/package_plugin.py --output dist/GCHAM_Data_Pack_Builder_1.1.2_test2.zip
          python scripts/validate_package.py dist/GCHAM_Data_Pack_Builder_1.1.2_test2.zip
      - name: Upload test plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GCHAM_Data_Pack_Builder_1.1.2_test2
          path: dist/GCHAM_Data_Pack_Builder_1.1.2_test2.zip
          if-no-files-found: error
