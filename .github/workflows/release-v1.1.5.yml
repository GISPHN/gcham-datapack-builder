name: Publish v1.1.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.1.5.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify approved plugin source and version
        run: |
          test "$(git rev-parse HEAD:gcham_datapack_builder)" = "d5b7506043e5553aed2850eab1ab1366d057d1b4"
          grep -qx "version=1.1.5" gcham_datapack_builder/metadata.txt
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check bandit flake8
      - name: Verify security, syntax and tests
        run: |
          python -m bandit -r gcham_datapack_builder -q
          python -m flake8 gcham_datapack_builder scripts tests --select=E9,F63,F7,F82
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ("gcham_datapack_builder", "scripts", "tests"):
              for path in Path(directory).rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("Python AST parse passed")
          PY
          python -m unittest discover -s tests -v
      - name: Build and validate release ZIP
        run: |
          python scripts/package_plugin.py --output dist/GCHAM_Data_Pack_Builder_1.1.5.zip
          python scripts/validate_package.py dist/GCHAM_Data_Pack_Builder_1.1.5.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.5 >/dev/null 2>&1; then
            echo "v1.1.5 already exists; refusing to replace the release."
            exit 1
          fi
          cat > release_notes.md <<'EOF'
          G-CHAM Data Pack Builder v1.1.5

          - Adds a prefecture-wide municipality boundary layer with labels.
          - Adds walking and cycling candidate roads after excluding expressways and toll roads. Legal access is not independently verified.
          - Skips unpublished N13 mesh archives and improves GSI shelter CSV recovery.
          - Keeps other facility layers available if A27 school district data are unavailable.

          The attached ZIP is packaged from the verified source tree. Its file contents match the v1.1.5 ZIP submitted to the QGIS plugin repository; compression metadata may differ.
          EOF
          gh release create v1.1.5 dist/GCHAM_Data_Pack_Builder_1.1.5.zip --target "$GITHUB_SHA" --title "G-CHAM Data Pack Builder v1.1.5" --notes-file release_notes.md --latest
